# Fork only: builds the amd64 GPU image of davidcoulson-deploy for the Unraid host.
name: Fork GPU image

on:
  push:
    branches: [davidcoulson-deploy]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-gpu-image
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'davidcoulson/Kokoro-FastAPI'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/gpu/Dockerfile.optimized
          platforms: linux/amd64
          build-args: DOWNLOAD_MODEL=true
          push: true
          tags: |
            ghcr.io/davidcoulson/kokoro-fastapi-gpu:latest
            ghcr.io/davidcoulson/kokoro-fastapi-gpu:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/davidcoulson/Kokoro-FastAPI
            org.opencontainers.image.revision=${{ github.sha }}
